# MediaConveyor 项目配置：项目元数据、依赖与工具配置的唯一出处。
#
# 本项目是「源码直接运行」的应用：Docker 跑源码、用户 clone 运行，不发布到 PyPI，
# 因此无 [build-system]、不做 pip 安装。
# 版本号只写在 [project] 的 version 字段（发布流程使用，见 RELEASE-GUIDE.md）。
#
# 依赖以 PEP 735 依赖组声明，完整依赖树锁定在 uv.lock（本仓库以 uv 0.13.5 生成，
# 读锁请使用不低于此的版本）：
#   uv sync --group dev           # runtime + pytest / ruff（本地开发与 CI）
#   uv sync --only-group runtime  # 仅运行依赖（Docker 镜像使用）
# pip ≥ 25.1 的 `pip install --group <组名>` 亦可安装，但不经过锁文件，仅作后备手段。
# 所有依赖钉精确版本，依赖升级时同步更新 pyproject.toml 与 uv.lock。

[project]
name = "mediaconveyor"
# 版本号唯一出处（发布流程使用，见 RELEASE-GUIDE.md）：
# [x].[y].[z] 为正式版，带 -dev 后缀为开发版。
version = "0.7.0-dev"
description = "监听指定目录并自动调用 FFmpeg 处理音视频文件的轻量级自动化工具"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HexStan", email = "vanadir@163.com" }]
requires-python = ">=3.14"
keywords = ["ffmpeg", "transcode", "media", "automation", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.urls]
Homepage = "https://github.com/HexStan/MediaConveyor"
Repository = "https://github.com/HexStan/MediaConveyor"
Issues = "https://github.com/HexStan/MediaConveyor/issues"
Changelog = "https://github.com/HexStan/MediaConveyor/blob/dev/CHANGELOG.md"

[dependency-groups]
# 运行依赖：全部第三方库（Docker 镜像只装本组）
runtime = [
    "humanfriendly==10.0",
]
# 开发与验证工具（运行时不需要，CI 的 lint / test job 安装本组，含 runtime）
dev = [
    { include-group = "runtime" },
    # pytest 不属于运行依赖，按约定经 dev 组安装
    "pytest==9.1.1",
    # Ruff 的扩展默认规则集随版本变化（见 [tool.ruff] 头部注释），钉版本以保证 lint 结果可复现
    "ruff==0.17.3",
]

[tool.mediaconveyor]
# 内置 FFmpeg 的版本（唯一出处），语义为 FFmpeg 发布分支（major.minor）：
# Docker 镜像（根目录 Dockerfile）取 BtbN/FFmpeg-Builds 的同名分支构建
# （ffmpeg-n{版本}-latest-linux{64|arm64}-gpl-{版本}）。
# 升级时仅需修改本值并重新构建镜像。
ffmpeg_version = "8.1"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# 规则集跟随 Ruff 0.17 起的扩展默认集（约 800 条，覆盖 F/E/W/B/SIM/PERF/PL/RUF 等
# 规则族，但不含 E501、ANN、COM 等风格类规则）。不在配置中逐条罗列全部规则，
# 只在此声明项目约定与例外；升级 Ruff 后若默认集变化，可用
# `ruff check --isolated --show-settings` 复核差异。

# E501 未在默认集中启用，此值供 ruff format 对齐现状
line-length = 100
target-version = "py314"

[tool.ruff.lint]

[tool.ruff.format]
# 格式化遵循 Ruff Format 默认风格，显式声明项目约定；行宽沿用顶层 line-length = 100。
#
# target-version = "py314" 使 format 会把 `except (A, B):` 改写为 PEP 758 的
# 无括号形式 `except A, B:`（Python 3.14 起合法），此为预期行为，非 bug。
quote-style = "double"
# 换行符固定为 LF，与 .gitattributes 一致（"auto" 默认值会逐文件探测，混入 CRLF
# 文件时不同平台产出不一致）。
line-ending = "lf"
