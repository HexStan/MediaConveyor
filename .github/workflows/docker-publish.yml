name: Docker Image Publish

on:
  push:
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  # pyproject.toml 同时承载依赖与工具配置（Dependabot 每周更新），
  # 仅当 version 字段相对上次推送实际变化时才构建镜像
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # version 比较需读取 before 提交的文件内容，fetch-depth: 0 见复合 action 说明
          fetch-depth: 0

      - name: Detect version change
        id: version
        uses: ./.github/actions/version-changed

  docker:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          REPO="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"

          if echo "$VERSION" | grep -qE '\-dev'; then
            TAGS="${REPO}:${VERSION},${REPO}:dev"
          else
            TAGS="${REPO}:${VERSION},${REPO}:latest"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
